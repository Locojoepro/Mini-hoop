

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Hoop Arena V4</title>
<style>
*{box-sizing:border-box}
body{background:#080b10;color:white;font-family:Arial;text-align:center;margin:0;padding:15px}
h1{font-size:22px;letter-spacing:3px}
.clock{font:bold clamp(60px,10vw,110px) monospace;color:#ffcf40}
.score{font:bold clamp(65px,12vw,130px) monospace;color:#55ff68}
.teams{display:flex;gap:12px}
.team{flex:1;background:#161b24;border-radius:12px;padding:12px;min-width:0}
button,input,select{font-size:16px;padding:10px;margin:4px;border-radius:7px;border:1px solid #555}
button{background:#293543;color:white;cursor:pointer}
input,select{background:#151b24;color:white;max-width:100%}
.small{color:#aaa;font-size:14px}
.red{color:#ff5555;font-size:30px}
.yellow{color:#ffcf40;font-size:30px}
canvas{width:100%;max-width:800px;touch-action:none}
.controls{padding:12px}
.green{color:#55ff68}
.primary{background:#176b36}
</style>
</head>
<body>

<h1>MINI HOOP ARENA V4</h1>

<div class="small">GAME CLOCK</div>
<div id="clock" class="clock">5:00</div>

<button class="primary" onclick="startClock()">START</button>
<button onclick="pauseClock()">PAUSE</button>
<button onclick="setTime()">SET TIME</button>

<p>PERIOD <span id="period">1</span>
<button onclick="nextPeriod()">NEXT PERIOD</button></p>

<div class="teams">
<div class="team">
<input id="homeName" value="HOME" style="width:100%;text-align:center">
<div id="home" class="score">0</div>
<button onclick="add('home',1)">+1</button>
<button onclick="add('home',2)">+2</button>
<button onclick="add('home',3)">+3</button>
<button onclick="add('home',-1)">-1</button>
<p>FOULS<br><span id="hf" class="red">0</span></p>
<button onclick="add('hf',1)">+</button>
<button onclick="add('hf',-1)">-</button>
<p>TIMEOUTS<br><span id="ht" class="yellow">5</span></p>
<button onclick="useTimeout('ht')">USE</button>
<button onclick="add('ht',1)">+</button>
</div>

<div class="team">
<input id="awayName" value="AWAY" style="width:100%;text-align:center">
<div id="away" class="score">0</div>
<button onclick="add('away',1)">+1</button>
<button onclick="add('away',2)">+2</button>
<button onclick="add('away',3)">+3</button>
<button onclick="add('away',-1)">-1</button>
<p>FOULS<br><span id="af" class="red">0</span></p>
<button onclick="add('af',1)">+</button>
<button onclick="add('af',-1)">-</button>
<p>TIMEOUTS<br><span id="at" class="yellow">5</span></p>
<button onclick="useTimeout('at')">USE</button>
<button onclick="add('at',1)">+</button>
</div>
</div>

<div class="controls">

<h3>POSSESSION</h3>

<select id="team">
<option value="home">HOME BALL</option>
<option value="away">AWAY BALL</option>
</select>

<button onclick="switchTeam()">SWITCH</button>

<select id="points">
<option value="2">2 POINTS</option>
<option value="3">3 POINTS</option>
<option value="1">FREE THROW</option>
</select>

<p>
<label>
<input type="checkbox" id="autoTeam" checked>
Auto possession
</label>
<label>
<input type="checkbox" id="autoThree" checked>
Auto three-pointers
</label>
</p>

<h3>SMART CAMERA</h3>

<button class="primary" onclick="startCamera()">START CAMERA</button>
<button onclick="stopCamera()">STOP CAMERA</button>
<button onclick="hideCamera()">SHOW / HIDE CAMERA</button>
<button onclick="calibrate('hoop')">CALIBRATE HOOP</button>
<button onclick="calibrate('line')">SET 3-POINT LINE</button>

<p id="status" class="green">Camera not started</p>
<p id="detection">Waiting for basketball</p>

<p class="small">
Home: Red shirts | Away: Purple shirts<br>
Green basketball
</p>

<video id="video" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<div id="cameraPanel">
<canvas id="canvas" width="480" height="360"></canvas>
<p id="instructions">Start camera and calibrate hoop.</p>

<label>Green ball sensitivity
<input type="range" id="sensitivity" min="5" max="65" value="22">
</label>
</div>

<p>
Attempts: <span id="attempts">0</span>
| Detected baskets: <span id="makes">0</span>
</p>

<button onclick="resetGame()">RESET GAME</button>

</div>

<script>
const $=id=>document.getElementById(id);

let duration=300000;
let remaining=duration;
let deadline=0;
let timer=null;
let audio=null;

function add(id,n){
$(id).textContent=Math.max(0,Number($(id).textContent)+n);
}

function showClock(){
let seconds=Math.ceil(remaining/1000);
$('clock').textContent=
Math.floor(seconds/60)+':'+
String(seconds%60).padStart(2,'0');
}

function enableAudio(){
try{
if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
audio.resume();
}catch(e){}
}

function buzzer(){
if(!audio)return;
let oscillator=audio.createOscillator();
let gain=audio.createGain();
oscillator.type='sawtooth';
oscillator.frequency.value=180;
gain.gain.value=0.12;
oscillator.connect(gain);
gain.connect(audio.destination);
oscillator.start();
oscillator.stop(audio.currentTime+0.9);
}

function startClock(){
enableAudio();
if(timer||remaining<=0)return;
deadline=Date.now()+remaining;
timer=setInterval(()=>{
remaining=Math.max(0,deadline-Date.now());
showClock();
if(remaining===0){
clearInterval(timer);
timer=null;
buzzer();
}
},50);
}

function pauseClock(){
if(timer){
remaining=Math.max(0,deadline-Date.now());
clearInterval(timer);
timer=null;
}
showClock();
}

function setTime(){
let value=prompt('Enter any time in minutes and seconds. Example: 8:30','5:00');
if(value===null)return;
if(!/^\d+(:[0-5]?\d)?$/.test(value)){
alert('Enter a time like 5:30');
return;
}
let p=value.split(':').map(Number);
let ms=(p[0]*60+(p[1]||0))*1000;
if(!Number.isSafeInteger(ms))return;
pauseClock();
duration=ms;
remaining=duration;
showClock();
}

function nextPeriod(){
pauseClock();
add('period',1);
remaining=duration;
showClock();
}

function useTimeout(id){
if(Number($(id).textContent)>0){
add(id,-1);
pauseClock();
}
}

function switchTeam(){
$('team').value=$('team').value==='home'?'away':'home';
shot=null;
holder=null;
candidate=null;
candidateFrames=0;
lockUntil=performance.now()+1800;
}

$('team').onchange=()=>{
shot=null;
holder=null;
candidate=null;
candidateFrames=0;
lockUntil=performance.now()+1800;
};

function resetGame(){
if(!confirm('Reset game?'))return;
pauseClock();
['home','away','hf','af','attempts','makes'].forEach(id=>$(id).textContent=0);
$('ht').textContent=5;
$('at').textContent=5;
$('period').textContent=1;
$('team').value='home';
remaining=duration;
shot=null;
holder=null;
candidate=null;
candidateFrames=0;
armed=0;
previous=null;
lockUntil=0;
showClock();
}

const video=$('video');
const canvas=$('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

let cameraRunning=false;
let starting=false;
let stream=null;
let frameID=null;
let hoop=[];
let line=[];
let calibration='';
let previous=null;
let armed=0;
let lastScore=-3000;
let lastAttempt=-3000;
let holder=null;
let holderTime=0;
let candidate=null;
let candidateFrames=0;
let shot=null;
let lockUntil=0;

async function startCamera(){
if(cameraRunning||starting)return;
starting=true;

try{
stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:'environment'},
width:{ideal:640},
height:{ideal:480}
},
audio:false
});

video.srcObject=stream;
await video.play();

canvas.width=480;
canvas.height=Math.round(
480*video.videoHeight/video.videoWidth
);

cameraRunning=true;
$('status').textContent='CAMERA ACTIVE';
calibrate('hoop');
frameID=requestAnimationFrame(track);

}catch(e){
if(stream)stream.getTracks().forEach(t=>t.stop());
video.srcObject=null;
$('status').textContent='Camera error: '+e.message;
}finally{
starting=false;
}
}

function stopCamera(){
cameraRunning=false;
cancelAnimationFrame(frameID);
if(stream)stream.getTracks().forEach(t=>t.stop());
video.srcObject=null;
stream=null;
shot=null;
armed=0;
previous=null;
$('status').textContent='Camera stopped';
}

function hideCamera(){
let p=$('cameraPanel');

if(p.style.display==='none'){
p.style.display='block';
}else{
if(calibration){
alert('Finish calibration first');
return;
}
p.style.display='none';
}

$('status').textContent=cameraRunning?
'CAMERA ACTIVE - TRACKING':
'Camera not started';
}

function calibrate(type){
if(!cameraRunning){
alert('Start the camera first');
return;
}

calibration=type;
$('cameraPanel').style.display='block';
armed=0;
shot=null;

if(type==='hoop'){
hoop=[];
line=[];
$('instructions').textContent='Tap the center of the rim';
}else{
if(hoop.length!==2){
calibration='';
alert('Calibrate the hoop first');
return;
}
line=[];
$('instructions').textContent='Tap one end of the 3-point line';
}
}

canvas.addEventListener('click',e=>{
if(!calibration)return;

let r=canvas.getBoundingClientRect();

let p={
x:(e.clientX-r.left)*canvas.width/r.width,
y:(e.clientY-r.top)*canvas.height/r.height
};

if(calibration==='hoop'){
hoop.push(p);

if(hoop.length===1){
$('instructions').textContent='Tap the bottom of the net';
}else{
if(hoop[1].y<=hoop[0].y+5){
hoop=[];
$('instructions').textContent='Try again. Tap rim, then net below it.';
return;
}
calibration='';
$('instructions').textContent='Hoop calibrated!';
}
}else if(calibration==='line'){
line.push(p);

if(line.length===1){
$('instructions').textContent='Tap the other end of the 3-point line';
}else{
if(Math.hypot(line[0].x-line[1].x,line[0].y-line[1].y)<10){
line=[];
$('instructions').textContent='Try again. Tap two different ends.';
return;
}
calibration='';
$('instructions').textContent='3-point line calibrated!';
}
}
});

function side(x,y){
let a=line[0],b=line[1];

return (b.x-a.x)*(y-a.y)-
(b.y-a.y)*(x-a.x);
}

function estimatePoints(player){
let manual=Number($('points').value);
if(manual===1)return 1;

if(!$('autoThree').checked||
line.length!==2||
hoop.length!==2||
!player)return manual;

let hoopSide=side(hoop[1].x,hoop[1].y);
let playerSide=side(player.x,player.y);

return hoopSide*playerSide<0?3:2;
}

function findPlayer(data,x,y){
let red=0,purple=0;
let rx=0,ry=0,pxs=0,pys=0;

for(let dy=-20;dy<85;dy+=3){
for(let dx=-55;dx<=55;dx+=3){

let px=Math.round(x+dx);
let py=Math.round(y+dy);

if(px<0||py<0||
px>=canvas.width||
py>=canvas.height)continue;

let i=(py*canvas.width+px)*4;

let r=data[i];
let g=data[i+1];
let b=data[i+2];

if(r>100&&r>g*1.6&&r>b*1.5){
red++;
rx+=px;
ry+=py;
}

if(r>75&&b>85&&
r>g*1.4&&b>g*1.5&&
b>r*.85&&b<r*2.3){
purple++;
pxs+=px;
pys+=py;
}
}
}

if(red>18&&red>purple*1.8){
return {
team:'home',
x:rx/red,
y:ry/red
};
}

if(purple>18&&purple>red*1.8){
return {
team:'away',
x:pxs/purple,
y:pys/purple
};
}

return null;
}

function madeBasket(t){
let team=$('team').value;
let points=Number($('points').value);

if(shot){
if($('autoTeam').checked)team=shot.team;
if($('autoThree').checked&&points!==1)
points=shot.points;
}

add(team,points);
add('makes',1);

$('detection').textContent=
team.toUpperCase()+' SCORES +'+points;

if($('autoTeam').checked&&points!==1){
$('team').value=team==='home'?'away':'home';
}

lastScore=t;
armed=0;
shot=null;
holder=null;
candidate=null;
candidateFrames=0;
lockUntil=t+1800;
}

function track(t){
if(!cameraRunning)return;

try{
ctx.drawImage(video,0,0,canvas.width,canvas.height);

let data=ctx.getImageData(
0,0,canvas.width,canvas.height
).data;

let sx=0,sy=0,n=0;
let tol=Number($('sensitivity').value);

for(let y=0;y<canvas.height;y+=2){
for(let x=0;x<canvas.width;x+=2){

let i=(y*canvas.width+x)*4;

let r=data[i];
let g=data[i+1];
let b=data[i+2];

if(g>65&&g-r>tol&&g-b>tol){
sx+=x;
sy+=y;
n++;
}
}
}

if(n>4&&n<1800){
let x=sx/n;
let y=sy/n;
let player=findPlayer(data,x,y);

if(!calibration&&t>lockUntil&&!shot){

if(player){
if(candidate===player.team){
candidateFrames++;
}else{
candidate=player.team;
candidateFrames=1;
}

if(candidateFrames>=3){
holder=player;
holderTime=t;

if($('autoTeam').checked){
$('team').value=player.team;
}

$('detection').textContent=
$('team').value.toUpperCase()+' POSSESSION';
}
}else{
candidate=null;
candidateFrames=0;
}

if(previous&&holder&&
t-holderTime<700&&
previous.y-y>7&&
t-lastAttempt>1000){

shot={
team:$('team').value,
points:estimatePoints(holder),
time:t
};

lastAttempt=t;
add('attempts',1);

$('detection').textContent=
shot.team.toUpperCase()+
' SHOOTS '+shot.points;
}
}

if(!calibration&&hoop.length===2){
let u=hoop[0],l=hoop[1];
let w=Math.max(12,Math.abs(l.y-u.y)*.85);

if(previous&&
previous.y<u.y&&
y>=u.y&&
Math.abs(x-u.x)<w){
armed=t;
}

if(armed&&
t-armed<1000&&
y>=l.y-4&&
Math.abs(x-l.x)<w&&
previous&&y>previous.y&&
t-lastScore>1000){
madeBasket(t);
}
}

previous={x,y};

ctx.strokeStyle='lime';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y,12,0,Math.PI*2);
ctx.stroke();

}else{
previous=null;
}

if(armed&&t-armed>1000)armed=0;

if(shot&&t-shot.time>2500){
shot=null;
holder=null;
$('detection').textContent='Tracking basketball';
}

for(let p of hoop){
ctx.strokeStyle='red';
ctx.lineWidth=3;
ctx.strokeRect(p.x-12,p.y-5,24,10);
}

if(line.length===2){
ctx.strokeStyle='yellow';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(line[0].x,line[0].y);
ctx.lineTo(line[1].x,line[1].y);
ctx.stroke();
}

}catch(e){
$('status').textContent='Tracking error: '+e.message;
}

if(cameraRunning){
frameID=requestAnimationFrame(track);
}
}

showClock();
</script>
</body>
</html>
