
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Hoop Arena V2</title>
<style>
*{box-sizing:border-box}
body{background:#080b10;color:white;font-family:Arial;text-align:center;margin:0;padding:12px}
h1{font-size:20px;letter-spacing:3px}
.clock{font:bold 80px monospace;color:#ffcf40}
.score{font:bold 90px monospace;color:#55ff68}
.teams{display:flex;gap:12px}
.team{flex:1;background:#161b24;border-radius:12px;padding:12px;min-width:0}
button,input,select{font-size:16px;padding:10px;margin:4px;border-radius:7px;border:1px solid #555}
button{background:#293543;color:white}
input,select{background:#151b24;color:white;max-width:90%}
.small{color:#aaa;font-size:13px}
.red{color:#ff5555;font-size:28px}
.yellow{color:#ffcf40;font-size:28px}
canvas{width:100%;max-width:800px;touch-action:none}
.controls{padding:12px}
</style>
</head>
<body>

<h1>MINI HOOP ARENA</h1>

<div class="small">GAME CLOCK</div>
<div id="clock" class="clock">5:00</div>

<button onclick="startClock()">START</button>
<button onclick="pauseClock()">PAUSE</button>
<button onclick="setClock()">SET TIME</button>

<p>PERIOD <span id="period">1</span>
<button onclick="nextPeriod()">NEXT</button></p>

<div class="teams">
<div class="team">
<input value="HOME" style="text-align:center;width:100%">
<div id="home" class="score">0</div>
<button onclick="score('home',1)">+1</button>
<button onclick="score('home',2)">+2</button>
<button onclick="score('home',3)">+3</button>
<button onclick="score('home',-1)">-1</button>
<p>FOULS<br><span id="hf" class="red">0</span></p>
<button onclick="change('hf',1)">+</button>
<button onclick="change('hf',-1)">-</button>
<p>TIMEOUTS<br><span id="ht" class="yellow">5</span></p>
<button onclick="timeout('ht')">Use</button>
<button onclick="change('ht',1)">+</button>
</div>

<div class="team">
<input value="AWAY" style="text-align:center;width:100%">
<div id="away" class="score">0</div>
<button onclick="score('away',1)">+1</button>
<button onclick="score('away',2)">+2</button>
<button onclick="score('away',3)">+3</button>
<button onclick="score('away',-1)">-1</button>
<p>FOULS<br><span id="af" class="red">0</span></p>
<button onclick="change('af',1)">+</button>
<button onclick="change('af',-1)">-</button>
<p>TIMEOUTS<br><span id="at" class="yellow">5</span></p>
<button onclick="timeout('at')">Use</button>
<button onclick="change('at',1)">+</button>
</div>
</div>

<div class="controls">
<select id="team">
<option value="home">Home possession</option>
<option value="away">Away possession</option>
</select>

<select id="points">
<option value="2">2 points</option>
<option value="3">3 points</option>
<option value="1">Free throw</option>
</select>

<br>
<button onclick="startCamera()">START CAMERA</button>
<button onclick="toggleCamera()">SHOW / HIDE CAMERA</button>
<button onclick="resetGame()">RESET GAME</button>
<p id="status">Camera not started</p>

<video id="video" playsinline muted hidden></video>
<div id="cameraPanel">
<canvas id="canvas" width="480" height="360"></canvas>
<p>Tap the rim center, then the bottom of the net.</p>
<label>Green ball sensitivity
<input id="sensitivity" type="range" min="5" max="65" value="22">
</label>
<button onclick="marks=[];armed=0">Recalibrate</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

let duration=300;
let remaining=300000;
let endTime=0;
let timer=null;
let audio=null;

function enableAudio(){
try{
if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
audio.resume();
}catch(e){}
}

function buzzer(){
if(!audio)return;
let o=audio.createOscillator();
let g=audio.createGain();
o.type='sawtooth';
o.frequency.value=180;
g.gain.value=.12;
o.connect(g);
g.connect(audio.destination);
o.start();
o.stop(audio.currentTime+.8);
}

function showClock(){
let s=Math.ceil(remaining/1000);
$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function tick(){
remaining=Math.max(0,endTime-Date.now());
showClock();
if(remaining===0){
pauseClock();
buzzer();
}
}

function startClock(){
enableAudio();
if(timer||remaining<=0)return;
endTime=Date.now()+remaining;
timer=setInterval(tick,100);
}

function pauseClock(){
if(timer)remaining=Math.max(0,endTime-Date.now());
clearInterval(timer);
timer=null;
showClock();
}

function setClock(){
let value=prompt('Enter minutes and seconds (example: 5:30)','5:00');
if(value===null)return;
if(!/^\d+(:[0-5]?\d)?$/.test(value)){
alert('Enter a valid time such as 5:30');
return;
}
let p=value.split(':').map(Number);
let s=p[0]*60+(p[1]||0);
if(!Number.isSafeInteger(s))return;
pauseClock();
duration=s;
remaining=s*1000;
showClock();
}

function change(id,n){
$(id).textContent=Math.max(0,Number($(id).textContent)+n);
}

function score(team,n){
change(team,n);
}

function timeout(id){
if(Number($(id).textContent)>0){
change(id,-1);
pauseClock();
}
}

function nextPeriod(){
pauseClock();
change('period',1);
remaining=duration*1000;
showClock();
}

function resetGame(){
if(!confirm('Reset the entire game?'))return;
pauseClock();
['home','away','hf','af'].forEach(id=>$(id).textContent=0);
$('ht').textContent=5;
$('at').textContent=5;
$('period').textContent=1;
remaining=duration*1000;
armed=0;
showClock();
}

const video=$('video');
const canvas=$('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

let marks=[];
let armed=0;
let lastScore=-2000;
let previous=null;
let cameraRunning=false;

async function startCamera(){
if(cameraRunning)return;
try{
video.srcObject=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:'environment'}},
audio:false
});
await video.play();
canvas.height=Math.round(canvas.width*video.videoHeight/video.videoWidth);
cameraRunning=true;
$('status').textContent='Camera ready. Calibrate your hoop.';
requestAnimationFrame(track);
}catch(e){
$('status').textContent='Camera error: '+e.message;
}
}

function toggleCamera(){
let p=$('cameraPanel');
p.style.display=p.style.display==='none'?'block':'none';
}

canvas.onclick=e=>{
let r=canvas.getBoundingClientRect();
if(marks.length===2)marks=[];
marks.push([
(e.clientX-r.left)*canvas.width/r.width,
(e.clientY-r.top)*canvas.height/r.height
]);
armed=0;
$('status').textContent=marks.length===2?'Ready to detect baskets':'Tap bottom of net';
};

function track(t){
ctx.drawImage(video,0,0,canvas.width,canvas.height);
let data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
let X=0,Y=0,N=0;
let sensitivity=Number($('sensitivity').value);

for(let y=0;y<canvas.height;y+=2){
for(let x=0;x<canvas.width;x+=2){
let i=(y*canvas.width+x)*4;
let r=data[i],g=data[i+1],b=data[i+2];
if(g>65&&g-r>sensitivity&&g-b>sensitivity){
X+=x;Y+=y;N++;
}
}
}

if(N>4&&N<1300){
let x=X/N,y=Y/N;
ctx.strokeStyle='lime';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(x,y,12,0,Math.PI*2);
ctx.stroke();

if(marks.length===2&&previous){
let [u,l]=marks;
let w=Math.max(12,Math.abs(l[1]-u[1])*.85);

if(previous.y<u[1]&&y>=u[1]&&Math.abs(x-u[0])<w){
armed=t;
}

if(armed&&t-armed<1000&&y>=l[1]-4&&Math.abs(x-l[0])<w&&y>previous.y&&t-lastScore>1000){
let p=Number($('points').value);
score($('team').value,p);
lastScore=t;
armed=0;
$('status').textContent='BASKET! +'+p;
}
}
previous={x,y};
}else{
previous=null;
}

if(armed&&t-armed>1000)armed=0;

for(let m of marks){
ctx.strokeStyle='red';
ctx.strokeRect(m[0]-12,m[1]-5,24,10);
}

requestAnimationFrame(track);
}
</script>
</body>
</html>
